services:
  db:
    image: mariadb
    restart: always
    ports:
      - "3307:3306" 
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=budget_db
    volumes:
      - budget-data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    depends_on:
      - db
    ports:
      - "8090:80"
    environment:
      - PMA_HOST=db
      - PMA_USER=root
      - PMA_PASSWORD=root

volumes:
  budget-data: